<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Leitlinien</title>
<meta name="description" content="Eigene Leitlinien-PDFs auf dem iPhone durchsuchen und auf neue Versionen prüfen.">
<meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1530" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leitlinien">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
  <svg width="0" height="0" class="sr" aria-hidden="true">
    <symbol id="lupenmarke" viewBox="0 0 32 32">
      <circle cx="13.2" cy="13.2" r="7.6" fill="none" style="stroke:var(--kobalt)" stroke-width="3.8" stroke-dasharray="44.4 3.36" transform="rotate(-57 13.2 13.2)"/>
      <path d="M20.4 20.4 27 27" style="stroke:var(--kobalt)" stroke-width="4" stroke-linecap="round"/>
      <rect x="9.6" y="11.9" width="7.2" height="2.6" rx=".8" style="fill:var(--fluo)"/>
    </symbol>
  </svg>
  <div class="oben" id="oben">
    <header class="kopf">
      <div class="marke">
        <svg class="lupenmarke" viewBox="0 0 32 32" aria-hidden="true"><use href="#lupenmarke"/></svg>
        <h1>Leitlinien</h1>
      </div>
      <button class="symbolknopf" id="hilfe-knopf" type="button" aria-label="Hilfe und Einstellungen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2.9-1.2 1.8v.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="16.9" r="1.05" fill="currentColor"/></svg>
      </button>
    </header>
    <div class="suche" role="search">
      <svg class="lupe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.2 15.2 20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <label class="sr" for="suchfeld">Leitlinien durchsuchen</label>
      <input id="suchfeld" type="search" placeholder="In deinen Leitlinien suchen" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button id="such-leeren" type="button" aria-label="Suche leeren" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor" opacity=".3"/><path d="m9 9 6 6m0-6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <main id="inhalt" aria-live="polite"></main>

  <button id="hinzufuegen" class="knopf hinzufuegen" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    PDFs hinzufügen
  </button>
  <input id="datei-eingabe" type="file" accept="application/pdf,.pdf" multiple hidden>

  <section id="betrachter" class="betrachter" aria-label="Dokument" hidden>
    <div class="b-kopf">
      <button class="b-knopf" id="b-zurueck" type="button" aria-label="Zurück">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Zurück
      </button>
      <div class="b-titel"><span id="b-titel"></span><span class="b-unter" id="b-unter"></span></div>
      <button class="b-knopf" id="b-zoom" type="button" aria-label="Seitenbreite" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="b-flaeche" id="b-flaeche"></div>
    <div class="b-leiste">
      <div class="b-gruppe">
        <button class="b-knopf" id="b-seite-zurueck" type="button" aria-label="Vorige Seite">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="b-zahl" id="b-seitenzahl"></span>
        <button class="b-knopf" id="b-seite-vor" type="button" aria-label="Nächste Seite">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="b-gruppe b-treffer" id="b-treffer">
        <button class="b-knopf" id="b-treffer-zurueck" type="button" aria-label="Vorige Fundstelle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="b-zahl" id="b-trefferzahl"></span>
        <button class="b-knopf" id="b-treffer-vor" type="button" aria-label="Nächste Fundstelle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </section>

  <div id="meldung" class="meldung" role="status" aria-live="polite"></div>
</body>
</html>
